[project]
name = "storypoint-oof"
version = "0.1.0"
description = "Leakage-safe multimodal OOF stacking for Agile story-point estimation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "torch>=2.6",
  "transformers>=4.48,<6",
  "xgboost>=2.1",
]

[project.scripts]
storypoint-oof = "storypoint_oof.cli:main"
storypoint-groupcv = "storypoint_oof.group_cv:main"
storypoint-stats = "storypoint_oof.statistical_analysis:main"
storypoint-repeated-random = "storypoint_oof.repeated_random:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storypoint_oof"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
